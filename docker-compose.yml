services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apigate
      POSTGRES_PASSWORD: apigate
      POSTGRES_DB: apigate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  upstream:
    build: ./examples/upstream
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  gateway:
    build: .
    environment:
      GATEWAY_CONFIG: /app/gateway.docker.yaml
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
      - upstream

volumes:
  postgres-data:
