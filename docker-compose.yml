services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apigate
      POSTGRES_PASSWORD: apigate
      POSTGRES_DB: apigate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Two instances so the resilience demo has something to fail over between —
  # see gateway.docker.yaml's `echo-upstream` route (healthCheck + retry +
  # circuitBreaker). Try: `docker compose stop upstream2`, keep curling.
  upstream:
    build: ./examples/upstream
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  upstream2:
    build: ./examples/upstream
    environment:
      PORT: 4000
    ports:
      - "4001:4000"

  gateway:
    build: .
    environment:
      GATEWAY_CONFIG: /app/gateway.docker.yaml
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - postgres
      - upstream
      - upstream2

volumes:
  postgres-data:
