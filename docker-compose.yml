services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apigate
      POSTGRES_PASSWORD: apigate
      POSTGRES_DB: apigate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apigate -d apigate"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Two instances so the resilience demo has something to fail over between —
  # see gateway.docker.yaml's `echo-upstream` route (healthCheck + retry +
  # circuitBreaker). Try: `docker compose stop upstream2`, keep curling.
  upstream:
    build: ./examples/upstream
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

  upstream2:
    build: ./examples/upstream
    environment:
      PORT: 4000
    ports:
      - "4001:4000"

  # A WebSocket echo server for trying the gateway's WebSocket proxying — see
  # gateway.docker.yaml's `ws-chat` / `ws-private` routes and README § WebSocket.
  ws-echo:
    build: ./examples/ws-echo
    environment:
      PORT: 4100
    ports:
      - "4100:4100"

  gateway:
    build: .
    environment:
      GATEWAY_CONFIG: /app/gateway.docker.yaml
    ports:
      - "8080:8080"
    # The gateway runs migrations against Postgres on boot and exits if it
    # can't connect, so it must wait for the databases to be *ready* — a bare
    # `depends_on` list only waits for the containers to have started.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      upstream:
        condition: service_started
      upstream2:
        condition: service_started
      ws-echo:
        condition: service_started

volumes:
  postgres-data:
