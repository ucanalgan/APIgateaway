# Used by docker-compose.yml, where redis/postgres/upstream are all real
# services reachable by name. See gateway.yaml for the plain local-dev config
# (no external dependencies) that this is a fuller sibling of.
server:
  port: 8080
  trustProxyHops: 1
  maxBodyBytes: 1048576
  maxHeaderCount: 100
  requestTimeoutMs: 30000
  watch: true

redis:
  url: redis://redis:6379
  failOpen: true

db:
  url: postgres://apigate:apigate@postgres:5432/apigate

# Demo-only secret, fine to hardcode alongside the demo db/redis creds above
# — see README § Admin API for what this unlocks and how it's checked.
admin:
  token: apigate-admin-demo-token

routes:
  # Plain passthrough, no rate limit/cache/auth — isolates pure proxy
  # overhead for the benchmark table in README § Benchmarking. The other
  # routes below all carry a low demo rate limit, which would dominate a
  # load-test result instead of measuring the proxy itself.
  - id: bench
    match:
      path: /bench/*
    rewrite:
      stripPrefix: /bench
    upstream:
      targets:
        - http://upstream:4000
      timeoutMs: 5000

  # Host-based routing (see README § Host-based routing): this route only
  # answers `*.sites.test`, whatever the path — the Host header picks the
  # route, so no DNS is needed to try it:
  #   curl -H 'Host: acme.sites.test' http://localhost:8080/hello
  - id: tenant-sites
    match:
      host: '*.sites.test'
      path: /*
    upstream:
      targets:
        - http://upstream:4000
      timeoutMs: 5000

  # Two targets + health check + breaker + retry — stop one
  # (`docker compose stop upstream2`) and traffic keeps flowing through the
  # other with no failed requests. See README § Resilience.
  - id: echo-upstream
    match:
      path: /echo/*
    rewrite:
      stripPrefix: /echo
    upstream:
      targets:
        - http://upstream:4000
        - http://upstream2:4000
      timeoutMs: 5000
      healthCheck:
        path: /health
        intervalMs: 5000
    retry:
      attempts: 2
      backoffMs: 100
    circuitBreaker:
      failureThreshold: 3
      resetTimeoutMs: 10000
    # `global` caps this route's total traffic across both targets above,
    # regardless of which client is asking — on top of, not instead of, the
    # per-IP limit. See README § Rate limiting.
    rateLimit:
      algorithm: tokenBucket
      keyBy: [ip, global]
      limit: 10
      windowSec: 60
      global: { limit: 30, windowSec: 60 }

  # redis/postgres are also published to the host (see docker-compose.yml),
  # so seed from your machine against gateway.yaml with its `redis`/`db`
  # blocks uncommented: `npm run seed -w packages/gateway`, then:
  #   curl -H "Authorization: Bearer <raw key from seed output>" http://localhost:8080/api/hello
  - id: protected-api
    match:
      path: /api/*
    rewrite:
      stripPrefix: /api
    upstream:
      targets:
        - http://upstream:4000
      timeoutMs: 5000
    auth:
      type: apiKey
    rateLimit:
      algorithm: tokenBucket
      keyBy: [tenant]
      limit: 100
      windowSec: 60

  # Second GET to the same path comes back with X-Cache: HIT and never
  # touches upstream (see README § Cache). setHeaders/removeHeaders only run
  # on a miss — a hit skips the outbound request entirely. Also CORS-enabled,
  # for a browser calling this cross-origin — see README § CORS. Try a
  # preflight: `curl -i -X OPTIONS http://localhost:8080/cached/hello
  #   -H 'Origin: http://localhost:5500' -H 'Access-Control-Request-Method: GET'`
  - id: cached-echo
    match:
      path: /cached/*
    rewrite:
      stripPrefix: /cached
    upstream:
      targets:
        - http://upstream:4000
      timeoutMs: 5000
    cache:
      enabled: true
      ttlSec: 30
      varyBy: [Accept-Language]
    transform:
      request:
        setHeaders: { X-Gateway: apigate }
    cors:
      enabled: true
      origins: ['*']
