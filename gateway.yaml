server:
  port: 8080
  trustProxyHops: 1
  maxBodyBytes: 1048576
  maxHeaderCount: 100
  requestTimeoutMs: 30000

redis:
  url: redis://localhost:6379
  failOpen: true

routes:
  - id: echo-upstream
    match:
      path: /echo/*
    rewrite:
      stripPrefix: /echo
    upstream:
      targets:
        - http://localhost:4000
      timeoutMs: 5000

