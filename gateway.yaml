server:
  port: 8080
  trustProxyHops: 1
  maxBodyBytes: 1048576
  maxHeaderCount: 100
  requestTimeoutMs: 30000

# Redis-backed, distributed rate limiting is opt-in — uncomment when you're
# actually running more than one gateway instance against the same quota
# (e.g. via docker-compose's redis service). Without it, each route falls
# back to an in-process memory store, which needs nothing else running.
# redis:
#   url: redis://localhost:6379
#   failOpen: true

# Needed only by routes with `auth: { type: apiKey }` below — the gateway
# runs its own migrations against this on startup. `npm run seed` creates a
# free/pro plan, a tenant, and prints a raw key to try against such a route.
# db:
#   url: postgres://apigate:apigate@localhost:5432/apigate

# Unlocks /admin/* (needs `db:` above too — see README § Admin API). Change
# the token before using this for anything beyond your own machine.
# admin:
#   token: change-me

routes:
  - id: echo-upstream
    match:
      path: /echo/*
    rewrite:
      stripPrefix: /echo
    upstream:
      targets:
        - http://localhost:4000
      timeoutMs: 5000
    rateLimit:
      algorithm: tokenBucket
      keyBy: [ip]
      limit: 10
      windowSec: 60

  # Uncomment this alongside `db:` (and `redis:`, for a shared cache) to try
  # API-key auth with tenant/plan-driven rate limits (see README § Auth).
  # - id: protected-api
  #   match: { path: /api/* }
  #   rewrite: { stripPrefix: /api }
  #   upstream: { targets: [http://localhost:4000] }
  #   auth: { type: apiKey }
  #   rateLimit: { algorithm: tokenBucket, keyBy: [tenant], limit: 100, windowSec: 60 }

  # Run a second upstream fixture (`PORT=4001 node examples/upstream/index.js`)
  # and try this to see failover — stop either one, traffic keeps flowing
  # through the other with no failed requests (see README § Resilience).
  # - id: resilient-api
  #   match: { path: /r/* }
  #   rewrite: { stripPrefix: /r }
  #   upstream:
  #     targets: [http://localhost:4000, http://localhost:4001]
  #     healthCheck: { path: /health, intervalMs: 5000 }
  #   retry: { attempts: 2, backoffMs: 100 }
  #   circuitBreaker: { failureThreshold: 3, resetTimeoutMs: 10000 }

  # Second GET to the same path comes back with X-Cache: HIT and never
  # touches upstream (see README § Cache). The example fixture doesn't set
  # its own Cache-Control, so this uses ttlSec as-is.
  # - id: cached-echo
  #   match: { path: /cached/* }
  #   rewrite: { stripPrefix: /cached }
  #   upstream: { targets: [http://localhost:4000] }
  #   cache: { enabled: true, ttlSec: 30, varyBy: [Accept-Language] }
  #   transform:
  #     request: { setHeaders: { X-Gateway: apigate } }

